<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- L'atelier n'est plus une page : c'est une destination de l'application, dans
         la même fenêtre que la conversation et « Ma parcelle ». Ce fichier reste pour
         les liens déjà partagés et les favoris — il redirige au lieu de rendre un 404.
         Redirection par <meta refresh> : la politique de sécurité du contenu interdit
         le script en ligne, et une page de redirection ne mérite pas un module. -->
    <meta http-equiv="refresh" content="0; url=index.html#/atelier" />
    <link rel="canonical" href="index.html" />
    <meta name="robots" content="noindex" />
    <title>L'atelier — OpenCacao</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="flag-strip" aria-hidden="true"></div>
    <main class="atelier-page">
      <p>
        L'atelier se trouve maintenant dans l'application.
        <a href="index.html#/atelier">Ouvrir OpenCacao</a>
      </p>
    </main>
  </body>
</html>
