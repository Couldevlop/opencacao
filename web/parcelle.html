<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- « Ma parcelle » n'est plus une page : c'est une destination de l'application,
         dans la même fenêtre que la conversation et l'atelier. Ce fichier reste pour
         les liens déjà partagés et les favoris — il redirige au lieu de rendre un 404.
         La redirection est faite par <meta refresh> et non par du JavaScript : la
         politique de sécurité du contenu interdit le script en ligne, et une page de
         redirection ne mérite pas un module. -->
    <meta http-equiv="refresh" content="0; url=index.html#/parcelle" />
    <link rel="canonical" href="index.html" />
    <meta name="robots" content="noindex" />
    <title>Ma parcelle — OpenCacao</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="flag-strip" aria-hidden="true"></div>
    <main class="parcelle-page">
      <p>
        « Ma parcelle » se trouve maintenant dans l'application.
        <a href="index.html#/parcelle">Ouvrir OpenCacao</a>
      </p>
    </main>
  </body>
</html>
