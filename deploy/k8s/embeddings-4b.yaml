# Service d'EMBEDDINGS 4B — Qwen3-Embedding-4B (GGUF Q8) servi par llama.cpp.
# Remplace l'ancien embeddings.gguf (XLM-R 146 Mo, 768-dim) par Qwen3-4B (2560-dim).
# À appliquer lors de la bascule (cf. docs/MIGRATION_embeddings_4b.md), APRÈS avoir
# construit l'index RAG correspondant (rag_index_4b.jsonl) — sinon les vecteurs
# requête/index sont de dimensions incompatibles et le RAG casse.
#
# Prérequis nœud : /opt/opencacao/models/embeddings-qwen3-4b.gguf (~4,3 Go) présent.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embeddings
  labels: { app: embeddings }
spec:
  replicas: 1
  selector:
    matchLabels: { app: embeddings }
  # Recreate : un seul pod monte le modèle (4,3 Go) en lecture seule ; pas de
  # rolling (éviterait deux pods chargeant 5 Go chacun en parallèle sur le nœud).
  strategy: { type: Recreate }
  template:
    metadata:
      labels: { app: embeddings }
    spec:
      containers:
        - name: llamacpp
          image: ghcr.io/ggml-org/llama.cpp:server
          args:
            - "--embeddings"
            - "-m"
            - "/models/embeddings-qwen3-4b.gguf"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8001"
            # Dimensionné sur la charge RÉELLE mesurée en prod (1488 appels / 25 j) :
            # 1486 entrées de 23-74 tokens (questions utilisateur) et 2 entrées de
            # 600-605 tokens (extraits PDF du cron d'enrichissement). 0 troncature.
            # -c 1024 laisse donc x1,7 de marge sur le pire cas observé ; -c 512
            # tronquerait les extraits longs et corromprait silencieusement l'index.
            - "-c"
            - "1024"
            # En mode --embeddings llama.cpp force n_batch = n_ubatch (assertion) :
            # les garder égaux évite le warning et rend la valeur effective explicite.
            # Une séquence plus longue que n_ubatch est découpée sans erreur (vérifié
            # sur les entrées de 605 tokens, progress = 0.85 puis release truncated=0).
            - "-b"
            - "256"
            - "-ub"
            - "256"
            # 1 seul slot : ~1,2 requête/heure en régime permanent, aucune contention.
            # Sans cette borne, llama.cpp « fit to device memory » choisit n_parallel=4
            # tout seul et gonfle le KV cache pour remplir la RAM libre du nœud.
            - "-np"
            - "1"
            # Cache de prompt inutile pour des embeddings (aucune génération) et plafonné
            # à 8192 Mio par défaut : on le désactive pour borner l'empreinte.
            - "--cache-ram"
            - "0"
            # Régime permanent : 4 threads (~0,7 s/embed), laisse les cœurs à
            # l'inférence. Le build de nuit utilise un pod séparé plus agressif.
            - "-t"
            - "4"
          ports:
            - containerPort: 8001
          volumeMounts:
            - name: modele
              mountPath: /models
              readOnly: true
          resources:
            # Mesuré (smaps_rollup) avec les paramètres ci-dessus : 196 Mio de mémoire
            # ANONYME (KV + buffers de calcul), le reste des ~4,3 Go étant le fichier
            # GGUF mmap'é — des pages propres, adossées au disque, que le noyau peut
            # récupérer sous pression. La `request` reflète donc le working set non
            # récupérable (+ marge), pas le RSS brut : réserver 5Gi bloquait 3 Gi
            # d'ordonnancement sur un cluster déjà à 62 % de requests.
            requests: { cpu: "500m", memory: "2Gi" }
            limits: { cpu: "4", memory: "6Gi" }
          readinessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 40  # le 4B met plus longtemps à charger que l'ancien
      volumes:
        - name: modele
          hostPath:
            path: /opt/opencacao/models
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: embeddings
spec:
  selector: { app: embeddings }
  ports:
    - port: 8001
      targetPort: 8001
