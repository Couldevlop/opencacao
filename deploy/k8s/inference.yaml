# Inférence CPU : serveur llama.cpp (OpenAI-compatible) servant le GGUF.
# JAMAIS exposé publiquement (ClusterIP).
#
# Cluster mono-nœud : le GGUF est déposé sur le nœud (/opt/opencacao/models) et
# monté en hostPath (lecture seule). Le serveur llama.cpp expose
# /v1/chat/completions (compatible OpenAI), ce que consomme l'API.
#
# CE DÉPLOIEMENT N'EST JAMAIS SUPPRIMÉ (spec V3 §4.5). Il est mis à zéro réplique
# quand le profil GPU prend la main, de sorte que le retour arrière soit un
# `kubectl scale` et non un rechargement de manifeste. Voir `deploy/scripts/profil.sh`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference
  labels: { app: inference }
spec:
  replicas: 1
  # Sélecteur INCHANGÉ, et il ne doit pas changer : le sélecteur d'un Deployment est
  # immuable, le modifier imposerait de supprimer puis recréer l'objet en production.
  # C'est aussi la raison pour laquelle les pods GPU portent un `app` DIFFÉRENT : avec
  # le même, ce ReplicaSet-ci les adopterait — donc les supprimerait, croyant avoir une
  # réplique de trop.
  selector:
    matchLabels: { app: inference }
  strategy: { type: Recreate }   # volume RWO mono-attache
  template:
    metadata:
      # `role: inference` est le label que suit le Service, et le SEUL point commun
      # entre les deux profils. `profil` n'est là que pour la lecture humaine
      # (`kubectl get pods -L profil`) et les journaux.
      labels: { app: inference, role: inference, profil: cpu }
    spec:
      containers:
        - name: llamacpp
          image: ghcr.io/ggml-org/llama.cpp:server
          args:
            - "-m"
            - "/models/opencacao-8b-Q4_K_M.gguf"   # GGUF déposé sur le nœud (hostPath)
            - "--alias"
            - "opencacao-8b"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "-c"
            - "4096"
            - "-t"
            - "12"         # threads CPU (nœud 16 vCPU, on laisse 4 pour prod+système)
            - "-fa"
            - "on"         # flash-attention : génération CPU plus rapide
            - "--cache-type-k"
            - "q8_0"       # cache KV quantifié (K) : moins de RAM à contexte égal
            - "--cache-type-v"
            - "q8_0"       # cache KV quantifié (V)
            - "-b"
            - "2048"       # taille de batch logique
            - "-ub"
            - "512"        # taille de micro-batch physique
            # Cache de prompt BORNÉ. Sans ce drapeau, llama.cpp applique 8192 Mio par
            # défaut et remplit jusqu'à saturation : mesuré le 24/07/2026 en prod,
            # « cache state: 109 prompts, 8183 MiB » soit 8,2 Go des 12,4 Go de mémoire
            # anonyme du pod, memory.current à 99,99 % de la limite de 12 Gi et
            # 133 974 franchissements du plafond (memory.events: max). Un OOM-kill a
            # eu lieu le 28/06/2026 (anon-rss 8 361 680 kB au moment du kill).
            # 1 Gio suffit : l'éviction est LRU et le préfixe système (~57 tokens),
            # que le keepalive KV maintient chaud, tient dans une fraction de ce budget.
            - "--cache-ram"
            - "1024"
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: modele
              mountPath: /models
              readOnly: true
          resources:
            requests: { cpu: "4", memory: "8Gi" }
            limits: { cpu: "12", memory: "12Gi" }
          readinessProbe:
            httpGet: { path: /v1/models, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30   # le 1er chargement du GGUF peut être long
      volumes:
        - name: modele
          hostPath:
            path: /opt/opencacao/models
            type: Directory
---
# Service UNIQUE des deux profils : c'est lui qui rend la bascule invisible côté API.
# Il ne sélectionne pas `app`, mais `role` — porté par les pods CPU comme par les pods
# GPU. Celui des deux qui a des répliques fournit les endpoints ; l'autre, à zéro, n'en
# fournit aucun. `INFERENCE_URL` ne change donc jamais.
apiVersion: v1
kind: Service
metadata:
  name: inference
spec:
  selector: { role: inference }
  ports:
    - port: 8000
      targetPort: 8000
