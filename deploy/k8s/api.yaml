# API FastAPI : garde-fous, cache, appel à l'inférence interne.
# Seule (avec web) joignable de l'extérieur, via l'Ingress.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
data:
  INFERENCE_BACKEND: "llama-cpp"
  INFERENCE_URL: "http://inference:8000"
  REDIS_URL: "redis://redis:6379/0"
  MODEL_NAME: "opencacao-8b"
  MODEL_VERSION: "1.1.0"
  # Version de l'image API (clé de cache). Tenue à jour par roll-image.sh à chaque
  # déploiement -> invalide les réponses post-traitées par une image antérieure.
  APP_VERSION: "0.6.28"
  RATE_LIMIT_PER_MIN: "20"
  # Plafond de génération (chantier latence). La consigne « 10 phrases maximum » du
  # prompt système borne la sortie ; ce plafond sert de filet de sécurité (une réponse
  # de 10 phrases ≈ 250-330 tokens). Prend effet sans recharger le modèle.
  INFERENCE_MAX_TOKENS: "400"
  LOG_LEVEL: "INFO"
  ENABLE_DOCS: "false"
  # Derrière l'Ingress Traefik : on fait confiance à X-Forwarded-For.
  TRUST_FORWARDED_FOR: "true"
  # Même origine (servie via l'Ingress) -> CORS inutile.
  CORS_ORIGINS: ""
  # "*" : le filtrage d'hôte est fait par l'Ingress (ne route que le domaine vers
  # l'API) ; "*" évite que TrustedHost rejette les sondes k8s (Host = IP du pod).
  ALLOWED_HOSTS: "*"
  # Inférence CPU lente : timeout interne large (le 60 s par défaut coupait les
  # générations longues -> 503). Cohérent avec proxy-read-timeout de l'Ingress.
  REQUEST_TIMEOUT_S: "300"
  # Journalisation (anonymisée) des interactions + retours 👍/👎 -> jeu de données.
  LOG_QUESTIONS: "true"
  DATASET_DIR: "/data"
  # RAG activé : embeddings (service interne) + index /data/rag_index.jsonl.
  RAG_ENABLED: "true"
  # Recall RAG : avec un corpus enrichi (FIRCA, ICCO, manuels…), on élargit un peu
  # la récupération (3 -> 5 passages) et on abaisse le seuil de similarité
  # (0,62 -> 0,55) pour faire remonter les documents pertinents sur des questions
  # moins littérales. À recalibrer si du bruit apparaît (cf. levier F9 : embeddings
  # plus forts + reranking).
  RAG_TOP_K: "5"
  RAG_MIN_SIMILARITE: "0.55"
  # Reranking (F9) : vivier dense large (30) puis fusion dense + recouvrement lexical.
  # Seuil lexical abaissé (0,33) + poids relevé (0,5) pour faire remonter un document
  # littéralement pertinent (source contenant « firca ») même sur une requête courte
  # comme « parle-moi de FIRCA ». Validé en prod (juin 2026).
  RAG_CANDIDATS: "30"
  RAG_POIDS_LEXICAL: "0.5"
  RAG_SEUIL_LEXICAL: "0.33"
  # Cache sémantique : sert une réponse cachée pour une question proche (cosinus
  # >= seuil). Le seuil cosinus (0,92) EST le garde-fou de précision — vérifié en
  # prod (un sujet différent est régénéré). Le garde-fou lexical (couverture des
  # mots-clés de la question cachée) était contre-productif à 0,75 : il rejetait les
  # vraies paraphrases (autres mots) sans bloquer les quasi-doublons à qualificatif
  # divergent (jeune/adulte, qui partagent presque tous les mots). Abaissé à 0,3
  # (juin 2026) pour laisser passer les paraphrases qui franchissent déjà le cosinus.
  SEMANTIC_CACHE_ENABLED: "true"
  SEMANTIC_CACHE_LEXICAL_MIN: "0.3"
  # Analytique des visites + géolocalisation pays (base GeoLite2 locale, IP non stockée).
  LOG_VISITES: "true"
  GEOIP_DB_PATH: "/models/GeoLite2-Country.mmdb"
  # Conversations persistantes (V2) : base SQLite sur le volume /data (PVC dataset),
  # conservée entre redéploiements. Migrations idempotentes au démarrage. RGPD :
  # purge automatique des conversations inactives au-delà de la rétention (en jours).
  SESSIONS_ENABLED: "true"
  SESSIONS_DB_PATH: "/data/opencacao_sessions.db"
  SESSIONS_RETENTION_JOURS: "365"
  # Authentification par lien magique (D2) — connexion email via l'API ZeptoMail
  # (port 443 ; le SMTP serait bloqué côté cluster). Le jeton ZEPTOMAIL_TOKEN vient du
  # Secret `opencacao-auth` (non versionné). Expéditeur = domaine vérifié ZeptoMail.
  AUTH_ENABLED: "true"
  AUTH_CANAL: "zeptomail"
  AUTH_BASE_URL: "https://opencacao.openlabconsulting.com"
  AUTH_EMAIL_FROM: "noreply@openlabconsulting.com"
  AUTH_EMAIL_FROM_NAME: "OpenCacao"
  ZEPTOMAIL_API_URL: "https://api.zeptomail.com/v1.1/email"
  # Plateforme agentique V3 (orchestrateur + agents RAG/Météo/Prix/Réglementation/
  # Reporting). Activée en prod (juin 2026). Le chemin V2 reste le repli si OFF.
  AGENTS_ENABLED: "true"
  # Source Météo réelle (Open-Meteo, API libre sans clé) : délai max par requête.
  METEO_TIMEOUT_S: "10"
  # Keepalive du préfixe KV (sprint latence #3) : micro-génération (1 token) toutes
  # les 10 min pour que cache_prompt reste chaud — le premier producteur après une
  # période calme ne repaie pas ~15-25 s de préremplissage. ~0,5 % de CPU.
  KV_KEEPALIVE_S: "600"
  # Prix bord-champ officiel (Conseil du Café-Cacao), valeur ADMINISTRÉE par campagne.
  # 0 = non renseigné -> l'agent Prix NE DONNE AUCUN chiffre et redirige (jamais de
  # prix inventé). À mettre à jour à chaque session du Conseil (valeur officielle).
  # Campagne intermédiaire 2026 : 1200 FCFA/kg (Conseil Café-Cacao, session N°1 du 26/06/2026).
  PRIX_BORD_CHAMP_FCFA_KG: "1200"
  PRIX_CAMPAGNE: "intermédiaire 2026"
  # Plafond de longueur d'un passage RAG (chantier latence) : coupe le gras des
  # passages pour réduire les tokens d'entrée. Réglable à chaud.
  RAG_PASSAGE_MAX_CHARS: "480"
  # Dialogue naturel (clarification formulée par le modèle plutôt que le texte
  # scripté). ACTIVÉ en prod le 24/07/2026 après validation A/B (0.6.73) : question
  # courte et complète, ~5-6 s de décodage CPU par tour vs scripté instantané.
  # Rollback : repasser à "false" + redémarrage API (~15 s).
  DIALOGUE_NATUREL_ENABLED: "true"
  # Parcelles & captures terrain (V3, chantier C1). OFF au premier déploiement : on
  # vérifie que le schéma SQLite se crée bien sur /data avant d'ouvrir les routes.
  PARCELLES_ENABLED: "false"
  PARCELLES_DB_PATH: "/data/parcelles.db"
  CAPTURES_DIR: "/data/captures"
  CAPTURES_RETENTION_JOURS: "90"
  # Quotas de capture (OWASP API4:2023). /data porte AUSSI sessions.db, l'index RAG et
  # le journal : sans borne, des captures satureraient le volume et emporteraient le
  # RAG. Le garde d'espace libre refuse d'écrire avant d'en arriver là.
  CAPTURES_QUOTA_PAR_APPAREIL: "200"
  CAPTURES_ESPACE_LIBRE_MIN_OCTETS: "104857600"
  # Plafond de corps de requête propre aux dépôts de capture (8 Mio). Le plafond
  # global MAX_BODY_BYTES (16 Ko, taillé pour une question) rejetterait toute photo
  # en 413 : on ouvre une porte étroite sur /v1/parcelles, sans relâcher le reste.
  CAPTURES_MAX_BODY_BYTES: "8388608"
  # Profil matériel : déclare les capacités disponibles, pas le backend
  # (INFERENCE_BACKEND s'en charge). Défaut "cpu" : une erreur de configuration
  # dégrade le service, elle ne le casse pas.
  PROFIL_MATERIEL: "cpu"
  # Analyse visuelle (V3, chantier C2). OFF tant que le service de vision n'est pas
  # déployé : l'API répond alors 503 avec une consigne qui oriente vers l'ANADER,
  # jamais une description inventée. Le VLM ne tient que sur GPU — même à "true",
  # un PROFIL_MATERIEL "cpu" laisse la source neutre branchée.
  # Atelier de livrables (V3, chantier C3). OFF au premier déploiement : on vérifie
  # que le schéma SQLite se crée bien sur /data avant d'ouvrir les routes. La
  # génération enchaîne un appel d'inférence PAR SECTION — ne pas l'activer sans
  # avoir mesuré le budget CPU d'une étude complète.
  RAPPORTS_ENABLED: "false"
  RAPPORTS_DB_PATH: "/data/rapports.db"
  # Levé par la sentinelle quand elle ramène le service au CPU sans intervention
  # humaine (deploy/k8s/sentinelle.yaml). Ne change aucun comportement du moteur : il
  # fait AFFICHER l'avis « service de secours » au lieu de « bientôt », et ferme les
  # capacités lourdes côté /v1/version. Remis à false par `jour-j.sh ouvrir|fermer`.
  REPLI_CPU: "false"
  VISION_ENABLED: "false"
  VISION_URL: "http://vision:8000"
  VISION_MODELE: "qwen3-vl"
  # AVANT DE PASSER VISION_ENABLED À "true", lire ceci. Le constat est SYNCHRONE et
  # enchaîne deux générations : vision (ce timeout) puis rédaction
  # (REQUEST_TIMEOUT_S). Cloudflare coupe une réponse d'origine vers 100 s — c'est
  # l'origine du 524 rencontré en juillet 2026 sur la composition multi-agents.
  # Vérifier le budget CUMULÉ, ou passer le constat en flux avant d'activer.
  VISION_TIMEOUT_S: "30"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app: api }
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      securityContext:
        fsGroup: 10001   # rend le volume /data inscriptible par l'utilisateur appuser
      containers:
        - name: api
          image: opencacao-api   # tag/registre fixés par kustomization.yaml
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-config
            # Jeton ZeptoMail (auth D2). optional : l'API démarre même sans le Secret
            # (l'auth retombe alors sur le canal console). Créé hors Git :
            #   kubectl -n opencacao create secret generic opencacao-auth \
            #     --from-literal=ZEPTOMAIL_TOKEN=<jeton>
            - secretRef:
                name: opencacao-auth
                optional: true
            # Clé Global Forest Watch (agent Satellite A8). optional : sans le Secret,
            # l'agent répond une consigne « vérification satellitaire indisponible »
            # (source neutre), aucun statut inventé. ⚠ La clé expire après UN AN
            # (créée le 05/07/2026 -> renouveler avant le 30/06/2027). Créé hors Git :
            #   kubectl -n opencacao create secret generic opencacao-gfw \
            #     --from-literal=GFW_API_KEY=<clé>
            - secretRef:
                name: opencacao-gfw
                optional: true
            # Jeton présenté à l'inférence quand elle est DÉPORTÉE sur un GPU loué
            # (spec V3 §4.5) : vLLM y tourne avec --api-key et refuse toute requête
            # sans jeton. optional : tant que l'inférence est interne au cluster, ce
            # Secret n'existe pas et l'API n'envoie aucun en-tête — c'est la
            # NetworkPolicy qui cloisonne. Créé hors Git, au moment de la bascule :
            #   kubectl -n opencacao create secret generic opencacao-inference \
            #     --from-literal=INFERENCE_API_KEY=<jeton>
            # Le MÊME jeton est passé à vLLM par --api-key côté pod.
            - secretRef:
                name: opencacao-inference
                optional: true
          volumeMounts:
            - name: dataset
              mountPath: /data
            - name: modeles
              mountPath: /models
              readOnly: true
          resources:
            requests: { cpu: "100m", memory: "320Mi" }
            limits: { cpu: "1", memory: "1Gi" }   # marge pour charger l'index RAG en mémoire
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8080
              httpHeaders:
                - name: Host
                  value: opencacao.openlabconsulting.com
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 8080
              httpHeaders:
                - name: Host
                  value: opencacao.openlabconsulting.com
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: dataset
          persistentVolumeClaim:
            claimName: dataset
        # Base GeoLite2 déposée sur le nœud (comme les modèles GGUF), lecture seule.
        - name: modeles
          hostPath:
            path: /opt/opencacao/models
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }
  ports:
    - port: 8080
      targetPort: 8080
